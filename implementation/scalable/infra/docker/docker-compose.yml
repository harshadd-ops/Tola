# Tola v1 local stack (implementation/scalable).
#
#   Infra only (default):  docker compose -f infra/docker/docker-compose.yml up -d
#   Full stack:            docker compose -f infra/docker/docker-compose.yml --profile app up -d --build
#
# Run from implementation/scalable/. Build contexts are relative to this file.
# Env: copies values from ../../.env (implementation/scalable/.env). Never commit .env.
# Ports (fixed by PROJECT_BRIEF §10): web 3000, api 8000. Postgres 5432, Redis 6379.

name: tola-scalable

x-app-env: &app-env
  env_file:
    - path: ../../.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://tola:tola_local_only@postgres:5432/tola
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    AI_FALLBACK_MODE: ${AI_FALLBACK_MODE:-cached}
    TOLA_ENV: local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tola
      POSTGRES_PASSWORD: tola_local_only   # local only; prod uses Cloud SQL IAM auth + Secret Manager
      POSTGRES_DB: tola
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tola -d tola"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply Alembic migrations before api/worker start.
  migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    <<: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    <<: *app-env
    command: ["uvicorn", "tola_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile   # FROM the api image; entrypoint tola-worker
    <<: *app-env
    command: ["tola-worker", "--queues", "high,default,low", "--with-scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
