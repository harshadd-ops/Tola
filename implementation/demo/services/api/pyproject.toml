[project]
name = "tola-demo-api"
version = "0.1.0"
description = "Tola demo API: FastAPI + SQLite, ledger-core (integer mg, hash chain, Ed25519), Lyzr/Sarvam with cached fallback. No auth by design (demo)."
requires-python = ">=3.12"
license = { text = "Proprietary (hackathon prototype)" }
dependencies = [
  "fastapi==0.153.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.5",
  "pynacl==1.6.2",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "lyzr-adk==0.1.12",
  "sarvamai==0.1.37",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.170.5",
  "ruff==0.17.1",
]

[project.scripts]
tola-api = "tola_api.main:run"
tola-seed = "tola_api.seed.loader:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tola_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: calls Lyzr or Sarvam over the network (skipped unless TOLA_LIVE_TESTS=1)",
  "story: replays seed/story.json end to end through the API",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "S105", "S110"]  # asserts in tests, FastAPI Depends, Bengali numerals/punctuation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
